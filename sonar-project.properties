# SonarQube Cloud (SonarCloud) configuration for nimbus-vscode.
# Project must be imported into the `nimbus-agent` SonarCloud org and a
# SONAR_TOKEN repo secret set; the sonar.yml workflow skips analysis when the
# token is absent. See the monorepo's docs/sonar-local.md for token/scanner setup.

sonar.organization=nimbus-agent
sonar.projectKey=nimbus-agent_nimbus-vscode
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=test
sonar.test.inclusions=**/*.test.ts

# dist/media are esbuild output; vscode-shim + the real-chat-panel /
# real-participant / ping-socket glue are thin vscode/node-IO seams that unit
# tests cannot execute, so they are excluded from coverage in vitest.config.ts
# too.
#
# The two lists are NOT identical: src/chat/webview/main.ts is excluded here but
# still measured by vitest (jsdom covers it, ~95% statements). Keep that in mind
# when adding a coverage-excluded file — it must be added to BOTH this list and
# vitest.config.ts to actually disappear from the denominator in both tools.
sonar.exclusions=**/node_modules/**,**/dist/**,**/media/**,**/*.d.ts
sonar.coverage.exclusions=src/vscode-shim.ts,src/chat/webview/main.ts,src/chat/real-chat-panel.ts,src/connection/ping-socket.ts,src/chat-participant/real-participant.ts

# vitest writes coverage/lcov.info (reporter "lcov" in vitest.config.ts).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.typescript.tsconfigPaths=tsconfig.json

# Block CI on the Quality Gate verdict (the scan action waits + exits non-zero
# on gate ERROR). Uses the built-in "Sonar way" gate.
sonar.qualitygate.wait=true
