# GitLab CI — ported from .github/workflows/ci.yml (build-test job).
# Warm-standby mirror of the GitHub Actions pipeline. GitHub Actions syntax
# does not translate to GitLab, so this is a faithful re-expression of the
# same gates, not a conversion. Kept in sync with package.json scripts.
#
# A Node image with Bun installed on top, not oven/bun. `bun run test` is
# `bunx vitest run`, and bunx honours vitest's `#!/usr/bin/env node` shebang;
# on oven/bun the only `node` is a fallback symlink to Bun itself, so the suite
# would run on the Bun runtime. Vitest 5 requires Node.js >= 22.12, and on the
# Bun runtime its jsdom environment fails to start: every
# `@vitest-environment jsdom` file dies with "'addEventListener' called on an
# object that is not a valid instance of EventTarget". The image matches the
# Node the GitHub runners ship (22.23.3 as of runner image 20260927).
image: node:22.23.3-trixie

stages:
  - verify

# bun's global cache keyed on the lockfile — restored across jobs/pipelines.
# It has to live inside the project directory to be cached, which is why
# .gitignore lists it: biome's vcs.useIgnoreFile is what keeps `bun run lint`
# from scanning the cached packages.
cache:
  key:
    files:
      - bun.lock
  paths:
    - .bun-cache

variables:
  BUN_INSTALL_CACHE_DIR: "$CI_PROJECT_DIR/.bun-cache"
  CI: "true"

build-test:
  stage: verify
  interruptible: true
  before_script:
    # Bun is pinned here and in the workflows' `bun-version` input; move the
    # two together.
    - npm install -g bun@1.3.14
    # git ships with this image (node's Debian images build on
    # buildpack-deps); biome's ignore-file resolution (vcs.useIgnoreFile)
    # needs it or it scans node_modules. Trust the workspace (root-owned
    # runner checkout).
    - git config --global --add safe.directory '*'
    - bun install --frozen-lockfile
  script:
    - bun run typecheck
    - bun run lint
    - bun run check-settings-docs
    - bun run test
    - bun run build
    - bun run check-bundle
    - bun run check-vsix-contents
