name: Publish VS Code Extension

# Triggered by tags of the form `v0.2.0`. The tag version is written into
# package.json before packaging so Marketplace and Open VSX match the tag.
#
# Required repository secrets (in the `release` environment):
#   * VSCE_PAT — Azure DevOps PAT, "Marketplace (Manage)" scope, publisher `nimbus-agent`.
#   * OVSX_PAT — Open VSX token for the `nimbus-agent` namespace.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to VS Code Marketplace + Open VSX
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5

      - name: Setup Node (vsce/ovsx are Node CLIs)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # The same four pre-build gates ci.yml runs — typecheck, lint,
      # check-settings-docs, test — followed after the build by the same two
      # artifact guards. A release must not be able to publish something a PR
      # would have been blocked for.
      - name: Check settings docs
        run: bun run check-settings-docs

      - name: Test
        run: bun run test
        env:
          CI: "true"

      - name: Resolve version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' did not parse as semver after stripping 'v'"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Stamp package.json with the tag version
        run: npm pkg set version="${{ steps.version.outputs.version }}"

      - name: Build bundle
        run: bun run build

      - name: Verify bundle invariant (vscode is the only external)
        run: bun run check-bundle

      - name: Verify .vsix ships only the allowlisted files
        run: bun run check-vsix-contents

      - name: Package .vsix
        run: |
          mkdir -p dist-vsix
          bunx vsce package --no-dependencies --out dist-vsix/nimbus-${{ steps.version.outputs.version }}.vsix

      # Verifiable for anyone who downloads the .vsix from the GitHub Release.
      # The Marketplace does its own repository signing and does not surface
      # this attestation; we do not claim it covers a Marketplace download.
      - name: Attest .vsix build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-vsix/nimbus-${{ steps.version.outputs.version }}.vsix

      - name: Verify required publish secrets are present
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT secret is not configured."
            exit 1
          fi
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT secret is not configured."
            exit 1
          fi

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        # No --pat flag: vsce reads VSCE_PAT from the environment. Process argv
        # is world-readable via /proc/<pid>/cmdline, so passing it on the
        # command line exposes the token to anything co-resident on the runner.
        run: bunx vsce publish --no-dependencies --packagePath dist-vsix/nimbus-${{ steps.version.outputs.version }}.vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        # No -p flag: ovsx reads OVSX_PAT from the environment, same reason.
        run: bunx ovsx publish dist-vsix/nimbus-${{ steps.version.outputs.version }}.vsix

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nimbus-vsix-${{ steps.version.outputs.version }}
          path: dist-vsix/nimbus-${{ steps.version.outputs.version }}.vsix
          if-no-files-found: error
          retention-days: 7

  release:
    name: Mirror .vsix on GitHub Release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Download .vsix artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nimbus-vsix-${{ needs.publish.outputs.version }}
          path: dist-vsix

      - name: Attach .vsix to the GitHub Release
        # Release Please already created the release with changelog-derived notes;
        # only attach the packaged .vsix, don't overwrite its title/body. (For a
        # manual tag with no pre-existing release, this creates a bare release with
        # just the asset — the expected exception now that releases are automated.)
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist-vsix/nimbus-${{ needs.publish.outputs.version }}.vsix
          tag_name: ${{ github.ref_name }}
