name: Dependabot lockfile sync

# Dependabot updates package.json but cannot maintain bun's bun.lock, so its npm
# PRs fail CI's `bun install --frozen-lockfile`. This regenerates bun.lock on a
# Dependabot PR and commits it back to the PR branch so CI passes.
#
# pull_request_target is required so a write-capable token can push to the PR
# branch. That trigger runs privileged code against a PR author's tree, so four
# things keep it safe — all four pinned by
# test/unit/dependabot-lockfile-workflow.test.ts, because an edit that dropped
# one would otherwise be silent:
#
#   1. the job is gated to the `dependabot[bot]` actor — first-party version
#      bumps only, never an arbitrary contributor's PR;
#   2. `bun install --ignore-scripts` — no lifecycle script from the PR's
#      package.json or its dependency tree executes in the privileged job;
#   3. `persist-credentials: false` — the token is never written into
#      .git/config, where the checked-out tree could read it back out;
#   4. the checkout pins `head.sha`, not `head.ref` — the exact commit that
#      fired the event, so a force-push landing between trigger and checkout
#      cannot swap the tree out from under the job.
#
# (3) means the push-back cannot rely on the checkout's remote; it carries the
# token inline instead, the shape the Nimbus publish workflows already use.

on:
  pull_request_target:
    branches: [main]
    paths:
      - "package.json"

# Read-only by default: only the sync job below is granted the write it needs.
permissions:
  contents: read

concurrency:
  group: dependabot-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-lockfile:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout the PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The exact commit that fired the event. A branch name would re-resolve
          # at checkout time, so a force-push in between could hand this
          # privileged job a tree nobody triggered it for.
          ref: ${{ github.event.pull_request.head.sha }}
          # Keep the write-capable token out of .git/config — the checked-out
          # tree must never be able to read it back. The push step supplies it
          # inline instead.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Regenerate bun.lock (no install scripts)
        run: bun install --ignore-scripts

      - name: Commit bun.lock if it changed
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through the environment, never interpolated into the script:
          # a branch name is attacker-influenced text and would otherwise be a
          # shell-injection seam.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already in sync — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: sync bun.lock for Dependabot bump"
          # HEAD is detached at head.sha, hence the explicit refspec. If the
          # branch moved since the trigger this is no longer a fast-forward and
          # the push FAILS — deliberately: never clobber a commit we never saw.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${HEAD_REF}"
