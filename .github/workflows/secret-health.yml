name: Secret health

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC, matching the monorepo monitor
  workflow_dispatch:

permissions:
  contents: read

# A manual workflow_dispatch overlapping the Monday cron would race the
# label-scoped dedup lookup below and could file two alert issues for the
# same incident. Serialize runs instead of canceling — a probe in flight
# should finish, not be dropped.
concurrency:
  group: secret-health
  cancel-in-progress: false

jobs:
  check:
    name: Probe publish credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      # This workflow previously ran with no checkout at all, because it only
      # needed to probe two secrets and shell out to `gh`. It now also has to
      # answer "how much runway is left on a token that still works" — a
      # classification with real boundaries, and boundaries belong in a tested
      # module, not in an untestable `case` statement inside a `run:` block. So:
      # check out, run `scripts/secret-health.ts` (dependency-free, so no
      # install step is needed), and leave the `gh` issue plumbing below as it
      # was.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Probe VSCE_PAT
        id: vsce
        uses: nimbus-agent/.github/actions/probe-publish-token@5fb42792fa88287048fd24f704183b9a9b807a67
        with:
          tool: vsce
          namespace: nimbus-agent
        env:
          PUBLISH_TOKEN: ${{ secrets.VSCE_PAT }}

      - name: Probe OVSX_PAT
        id: ovsx
        uses: nimbus-agent/.github/actions/probe-publish-token@5fb42792fa88287048fd24f704183b9a9b807a67
        with:
          tool: ovsx
          namespace: nimbus-agent
        env:
          PUBLISH_TOKEN: ${{ secrets.OVSX_PAT }}

      # Classification is deliberately separate from reporting, and always
      # succeeds: it emits the annotations + step summary, writes the issue body
      # to a file, and reports `hard` / `warn` as outputs. If it failed here, the
      # reporting step below would be skipped and a genuine `dead` verdict would
      # never reach an issue.
      #
      # `if: always()` so an infra-level failure upstream (bad action ref,
      # network) is still classified — an unreported probe interpolates to "" and
      # lands on `unrecognised`, which is hard.
      - name: Classify credential health
        id: classify
        if: always()
        env:
          VSCE_STATUS: ${{ steps.vsce.outputs.status }}
          OVSX_STATUS: ${{ steps.ovsx.outputs.status }}
        run: bun scripts/secret-health.ts

      # Only a HARD verdict files or comments on an issue.
      #
      # An approaching expiry is true for up to 76 consecutive days. Opening an
      # issue for it would leave a permanently-open alert on this repo, and a
      # permanently-open alert is exactly how the *next* real finding gets
      # skimmed past — the Nimbus monorepo learned this the expensive way (its
      # `release-health` issue stood open on a VSCE_PAT deadline row, and the
      # week an undeclared org secret appeared it read as more of the same).
      #
      # So the warning half of the split lives in the ::warning:: annotations and
      # the step summary, which are per-run and cannot accumulate. When an issue
      # IS filed, its body carries every row in its own section, so a dated row
      # still appears there — distinctly, and never under the BROKEN heading.
      - name: File or update the alert issue
        if: always() && steps.classify.outputs.hard == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY_FILE: ${{ steps.classify.outputs.body_file }}
        run: |
          set -euo pipefail
          title="🔑 Publish credential health alert"
          label="publish-credential-health"
          # There is a checkout in this workflow now, but `gh` resolves its repo
          # from the git remote and `persist-credentials: false` leaves no
          # authenticated one — and `gh` reads `GH_REPO`, which Actions does not
          # set, rather than `GITHUB_REPOSITORY`. Every `gh` call below is
          # therefore explicit about its target repo via `--repo`.
          #
          # Dedup is label-scoped, not a text search: `gh issue list --search`
          # is a fuzzy full-text match over title AND body, so any unrelated
          # open issue that happens to mention "publish"/"credential"/"health"
          # would win the slot and swallow this alert as a comment on the
          # wrong issue, with the real alert never created. `gh issue create
          # --label` fails if the label doesn't exist, so create it first
          # (idempotent via --force) so the workflow is self-sufficient on a
          # fresh repo.
          gh label create "$label" --repo "$GITHUB_REPOSITORY" --color "B60205" \
            --description "Publish credential rotation/provisioning alerts (secret-health.yml)" --force
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$label" --json number --jq '.[0].number // empty')"
          # The body is multi-line markdown and reaches gh through --body-file,
          # never as an inline argument.
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$BODY_FILE"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$BODY_FILE" --label "$label"
          fi
          exit 1

      - name: Report the outcome
        if: always() && steps.classify.outputs.hard != 'true'
        env:
          WARN: ${{ steps.classify.outputs.warn }}
          VSCE_STATUS: ${{ steps.vsce.outputs.status }}
          OVSX_STATUS: ${{ steps.ovsx.outputs.status }}
        run: |
          set -euo pipefail
          # The per-row ::warning:: annotations were already emitted by the
          # classify step; this states only the job-level outcome. A warning does
          # NOT fail the job — that is the entire point of separating a dated
          # credential from a rejected one.
          if [ "$WARN" = "true" ]; then
            echo "scheduled credential work outstanding (VSCE_PAT=${VSCE_STATUS}, OVSX_PAT=${OVSX_STATUS}) — nothing is broken; see the annotations above"
          else
            echo "both publish credentials healthy"
          fi
