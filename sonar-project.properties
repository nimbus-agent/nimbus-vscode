# SonarQube Cloud (SonarCloud) configuration for nimbus-vscode.
# Project must be imported into the `nimbus-agent` SonarCloud org and a
# SONAR_TOKEN repo secret set; the sonar.yml workflow skips analysis when the
# token is absent. See the monorepo's docs/sonar-local.md for token/scanner setup.

sonar.organization=nimbus-agent
sonar.projectKey=nimbus-agent_nimbus-vscode
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=test
sonar.test.inclusions=**/*.test.ts

# dist/media are esbuild output; vscode-shim + the real-chat-panel /
# real-participant / ping-socket / real-context-view / real-lm-tools glue are
# thin vscode/node-IO seams that unit tests cannot execute, so they are excluded
# from coverage in vitest.config.ts too.
#
# A coverage-excluded file must be in BOTH this list and vitest.config.ts's
# `coverage.exclude` to actually leave the denominator in both tools. The two
# lists diverge in exactly two places today, both deliberate:
#
#   * src/chat/webview/main.ts — excluded HERE only. jsdom really does exercise
#     it, so vitest measures it (~95% statements).
#   * src/scm/real-git.ts — excluded in VITEST only, so Sonar measures it and
#     reports 0.0%. That figure is an artifact of this asymmetry, not a coverage
#     gap; it is left visible rather than hidden behind a second exclusion.
#
# test/unit/coverage-exclusions.test.ts fails on any THIRD divergence, so this
# comment cannot go stale the way it did when it named only the first of the two.
sonar.exclusions=**/node_modules/**,**/dist/**,**/media/**,**/*.d.ts
sonar.coverage.exclusions=src/vscode-shim.ts,src/chat/webview/main.ts,src/chat/real-chat-panel.ts,src/connection/ping-socket.ts,src/chat-participant/real-participant.ts,src/lm-tools/real-lm-tools.ts,src/context/real-context-view.ts

# vitest writes coverage/lcov.info (reporter "lcov" in vitest.config.ts).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.typescript.tsconfigPaths=tsconfig.json

# Block CI on the Quality Gate verdict (the scan action waits + exits non-zero
# on gate ERROR). Uses the built-in "Sonar way" gate.
sonar.qualitygate.wait=true
