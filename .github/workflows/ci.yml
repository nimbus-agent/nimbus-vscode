name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check settings docs
        run: bun run check-settings-docs

      - name: Test
        run: bun run test
        env:
          CI: "true"

      - name: Build
        run: bun run build

      - name: Check bundle invariant
        run: bun run check-bundle

      - name: Check .vsix contents
        run: bun run check-vsix-contents

  ui-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # Keyed on BOTH the pinned VS Code version (in run-ui-tests.mjs) and
      # package.json, which carries the ExTester version. Raised in review:
      # keying on the script alone means bumping vscode-extension-tester leaves
      # a cached chromedriver that its new version may not accept, and the
      # resulting CI failure looks like a test bug. Over-invalidating costs one
      # re-download; under-invalidating costs an afternoon.
      #
      # test-resources is ALSO the `--user-data-dir` ExTester launches VS Code
      # with (browser.js), so test-resources/settings/User/workspaceStorage is
      # where `workspaceState` lives — including the egress gate's "Always
      # send here" skip-store. This cache is deliberately NOT allowed to carry
      # that: restoring it from a key that changes almost never would let a
      # skip set by one run's tests silently poison every later run, failing
      # unrelated specs from a modal that no longer appears. Only the
      # downloaded VS Code + chromedriver binaries are cached.
      - name: Cache VS Code + chromedriver
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            test-resources
            !test-resources/settings
          key: ${{ runner.os }}-extest-${{ hashFiles('scripts/run-ui-tests.mjs', 'package.json') }}

      - name: Build
        run: bun run build

      # VS Code is an Electron app with no headless mode; xvfb supplies the
      # display. This is why the suite is Linux-only in CI.
      - name: Run UI tests
        run: xvfb-run -a bun run test:ui

      - name: Upload failure artifacts
        if: failure()
        # upload-artifact is not otherwise pinned in this file; this SHA is the
        # same one already pinned for actions/upload-artifact@v7 in
        # publish.yml, kept in the same `# vN` comment style.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-test-failure-artifacts
          path: |
            test-resources/screenshots
            test-resources/settings/logs
            test-resources/test.log
          if-no-files-found: ignore
          retention-days: 7

  # The extension is developed on Windows but every gate above runs on Linux.
  # This job is deliberately lean — only the platform-sensitive steps (path
  # handling, line endings, the esbuild output) — so it costs little. Lint and
  # the doc guards are platform-independent and stay single-OS.
  windows-check:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
        env:
          CI: "true"

      - name: Build
        run: bun run build

      - name: Check bundle invariant
        run: bun run check-bundle

      - name: Check .vsix contents
        run: bun run check-vsix-contents
