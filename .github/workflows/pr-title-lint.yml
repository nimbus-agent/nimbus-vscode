name: Lint PR Title

# The repo squash-merges, so the PR title becomes the commit on `main` that
# Release Please reads to compute the version bump and changelog. Enforce a
# Conventional Commit title so a malformed one can't silently break a release.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

# `edited` fires on every title keystroke-save, so fixing a malformed title
# queues a run per attempt against the same PR. Only the newest verdict can be
# right — cancel the rest. Keyed on the PR number, not the ref, because this is
# the one workflow whose input is the PR's metadata rather than its tree.
concurrency:
  group: pr-title-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-pr-title:
    name: Validate PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
